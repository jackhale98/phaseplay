" cy="0" r="7" transform="translate(30 64)" style="fill: #F5F2EA; animation-duration: 3.6s"></circle><circle class="pp-p2" cx="0" cy="0" r="7" transform="translate(52 70)" style="fill: #F5F2EA; animation-duration: 3.6s"></circle><circle class="pp-p3" cx="0" cy="0" r="7" transform="translate(84 80)" style="fill: #F5F2EA; animation-duration: 3.6s"></circle><g class="pp-ball" transform="translate(24 54)" style="animation-duration: 3.6s"><path class="pp-twirl" d="M-6 0 Q0 -8.70 6 0 Q0 8.70 -6 0 Z" style="fill: #E9A23B; animation-duration: 3.6s"></path></g></g></g></g><path d="M-2 86 H102 L96 93 L102 100 H-2 L4 93 Z" style="fill: #F5F2EA"></path><text x="50" y="95.8" style="font-family: Archivo, 'Archivo Expanded', 'Helvetica Neue', Arial, sans-serif; font-stretch: 125%; font-weight: 800; font-size: 7px; letter-spacing: 1.6px; text-anchor: middle; fill: #0F2A20">PHASEPLAY</text></svg>
