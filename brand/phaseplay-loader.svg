<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 108 120" role="img" aria-label="Loading"><style>
@keyframes pp-p1{0%,14%{transform:translate(30px,64px)}22%{transform:translate(35px,76px)}30%{transform:translate(48px,84px)}38%{transform:translate(63px,81px)}46%{transform:translate(70px,66px)}54%{transform:translate(71px,58px)}74%,92%{transform:translate(74px,30px)}93%,100%{transform:translate(30px,64px)}}
@keyframes pp-p2{0%,18%{transform:translate(52px,70px)}46%{transform:translate(54px,62px)}74%,92%{transform:translate(56px,52px)}93%,100%{transform:translate(52px,70px)}}
@keyframes pp-p3{0%,30%{transform:translate(84px,80px)}74%,92%{transform:translate(89px,48px)}93%,100%{transform:translate(84px,80px)}}
@keyframes pp-ball{0%,6%{transform:translate(24px,54px)}12%{transform:translate(35px,55px)}18%{transform:translate(46px,60px)}46%{transform:translate(48px,52px)}50%{transform:translate(56.5px,48px)}54%{transform:translate(65px,48px)}74%,92%{transform:translate(68px,20px)}93%,100%{transform:translate(24px,54px)}}
@keyframes pp-twirl{0%,6%{transform:rotate(-35deg)}18%{transform:rotate(145deg)}46%{transform:rotate(145deg)}54%{transform:rotate(325deg)}100%{transform:rotate(325deg)}}
@keyframes pp-rep{0%{opacity:0}6%{opacity:1}84%{opacity:1}92%{opacity:0}100%{opacity:0}}
.pp-p1,.pp-p2,.pp-p3,.pp-ball{transform-box:view-box;transform-origin:0 0;animation-iteration-count:infinite;animation-timing-function:linear}
.pp-p1{animation-name:pp-p1}.pp-p2{animation-name:pp-p2}.pp-p3{animation-name:pp-p3}.pp-ball{animation-name:pp-ball}
.pp-twirl{transform-box:fill-box;transform-origin:center;animation-name:pp-twirl;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.pp-rep{animation-name:pp-rep;animation-iteration-count:infinite;animation-timing-function:linear}
