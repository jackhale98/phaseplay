name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://phaseplay.app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SHA }}' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm i --frozen-lockfile

      # 1. Migrations are expand/contract: the code being deployed works with old and new schema.
      - name: Migrate D1
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply phaseplay --remote --env production

      # 2+3. One Worker serves the SPA and the API, so web and API ship atomically.
      - name: Build web
        run: pnpm --filter @phaseplay/web build
        env: { PUBLIC_VERSION: '${{ env.SHA }}' }
      - name: Deploy Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production --var VERSION:${{ env.SHA }} --message "${{ env.SHA }}"

      # 4. Smoke test production.
      - name: Health returns the new SHA
        run: |
          for i in $(seq 1 20); do
            v=$(curl -fsS https://phaseplay.app/api/health | jq -r .version) && [ "$v" = "$SHA" ] && exit 0
            sleep 6
          done
          echo "health did not report $SHA"; exit 1
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke against production
        run: npx playwright test -c e2e/prod.config.ts

      # 5. Roll back on failure and open an issue.
      - name: Roll back
        if: failure()
        working-directory: apps/api
        run: pnpm exec wrangler rollback --env production --message "auto-rollback of ${{ env.SHA }}" -y
      - name: Open an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Deploy of ${process.env.SHA.slice(0, 7)} failed and was rolled back`,
              body: `See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
