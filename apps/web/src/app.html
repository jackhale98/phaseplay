<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Phaseplay" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/archivo-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Before first paint: sends signed-in visitors from the landing page to Home, and applies a saved theme/team accent. Its CSP hash is computed in vite.config.ts. -->
    <script id="pp-theme">
      try {
        if (location.pathname === '/' && localStorage.getItem('pp:session') === '1')
          location.replace('/home');
        var t = localStorage.getItem('pp:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('pp:accent');
        if (a) {
          var s = JSON.parse(a);
          for (var k in s) document.documentElement.style.setProperty(k, s[k]);
        }
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
