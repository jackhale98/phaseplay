<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Phaseplay" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/archivo-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Before first paint: sends signed-in visitors from the landing page to Home, and applies a saved theme/team accent. Its CSP hash is computed in vite.config.ts. -->
    <script id="pp-theme">
      try {
        if (location.pathname === '/' && localStorage.getItem('pp:session') === '1')
          location.replace('/home');
        var t = localStorage.getItem('pp:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('pp:accent');
        if (a) {
          var s = JSON.parse(a);
          for (var k in s) document.documentElement.style.setProperty(k, s[k]);
        }
      } catch (e) {}
      // Below-the-fold images (data-defer) load only as they come near the screen, so they never
      // compete with the first paint and phones on poor signal don't download what isn't seen.
      addEventListener('load', function () {
        var fill = function (img) {
          var group = img.closest('picture') || img;
          group.querySelectorAll('[data-defer]').forEach(function (el) {
            if (el.dataset.srcset) el.srcset = el.dataset.srcset;
          });
          if (img.dataset.src) img.src = img.dataset.src;
        };
        var imgs = document.querySelectorAll('img[data-defer]');
        if (!('IntersectionObserver' in window)) return imgs.forEach(fill);
        var io = new IntersectionObserver(
          function (hits) {
            hits.forEach(function (h) {
              if (!h.isIntersecting) return;
              io.unobserve(h.target);
              fill(h.target);
            });
          },
          { rootMargin: '600px 0px' },
        );
        imgs.forEach(function (img) {
          io.observe(img);
        });
      });
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
