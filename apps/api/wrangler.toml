# One Worker serves the SPA (static assets) and the API on the same origin.
# Top level = local development. `--env test` = e2e/integration. `--env production` = phaseplay.app.
name = "phaseplay-dev"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/build"
binding = "ASSETS"
not_found_handling = "none"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/cal/*"]

[define]
__TEST_AUTH__ = "true"

[vars]
ENV = "development"
RP_ID = "localhost"
ORIGINS = "http://localhost:5173,http://localhost:8787,http://localhost:4173"
VERSION = "dev"

[[d1_databases]]
binding = "DB"
database_name = "phaseplay"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["17 3 * * *"]

[env.test]
name = "phaseplay-test"
[env.test.define]
__TEST_AUTH__ = "true"
[env.test.vars]
ENV = "test"
RP_ID = "localhost"
ORIGINS = "http://localhost:8787,http://localhost:8788,http://localhost:8789,http://localhost:8790,http://localhost:8791,http://localhost:8792,http://localhost:8793,http://localhost:8794,http://localhost:8795,http://localhost:8796,http://localhost:8797,http://localhost:8798,http://localhost:8799,http://localhost:5173,http://localhost:4173"
VERSION = "test"
[[env.test.d1_databases]]
binding = "DB"
database_name = "phaseplay"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[[env.test.ratelimits]]
name = "RL_AUTH"
namespace_id = "1002"
simple = { limit = 10000, period = 60 }

[env.production]
name = "phaseplay"
routes = [
  { pattern = "phaseplay.app", custom_domain = true },
  { pattern = "www.phaseplay.app", custom_domain = true },
]
workers_dev = false
preview_urls = false
[env.production.define]
__TEST_AUTH__ = "false"
[env.production.vars]
ENV = "production"
RP_ID = "phaseplay.app"
ORIGINS = "https://phaseplay.app"
VERSION = "dev"
[[env.production.d1_databases]]
binding = "DB"
# No database_id: the first `wrangler deploy` (Cloudflare Workers Builds) creates "phaseplay"
# automatically and later deploys find it by name.
database_name = "phaseplay"
migrations_dir = "migrations"
[[env.production.ratelimits]]
name = "RL_AUTH"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
[env.production.triggers]
crons = ["17 3 * * *"]
[env.production.observability]
enabled = true
